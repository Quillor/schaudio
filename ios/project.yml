name: Schaudio
options:
  bundleIdPrefix: com.quillor
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Schaudio:
    type: application
    platform: iOS
    sources:
      - path: Schaudio/Sources
      - path: Schaudio/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quillor.schaudio
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_CFBundleDisplayName: Schaudio
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Schaudio/Info.plist
      properties:
        CFBundleDisplayName: Schaudio
        UILaunchScreen: {}
        # Google requires iOS OAuth clients to redirect to the reversed client id.
        CFBundleURLTypes:
          - CFBundleURLName: com.quillor.schaudio.oauth
            CFBundleURLSchemes:
              - com.googleusercontent.apps.929848887321-dnn5rn5i6log3e1cakbfc6301ff1n26k
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
